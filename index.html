<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symulator Federal Signal AS 422 Polonia - Gapless Audio</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            user-select: none;
            touch-action: manipulation;
        }

        .remote {
            background: #2b2b2d;
            width: 260px;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 
                inset -3px -3px 10px rgba(0,0,0,0.5), 
                inset 3px 3px 10px rgba(255,255,255,0.1), 
                0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .speaker-grill {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 25px;
            align-items: center;
        }

        .grill-line {
            background: #111;
            height: 4px;
            border-radius: 2px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }
        .grill-line:nth-child(1) { width: 40px; }
        .grill-line:nth-child(2) { width: 60px; }
        .grill-line:nth-child(3) { width: 40px; }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background-color: #d8e2e8;
            border: 2px solid #111;
            height: 55px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.8), 
                0 4px 6px rgba(0,0,0,0.4);
            transition: background-color 0.1s, box-shadow 0.1s, transform 0.1s;
            pointer-events: auto;
        }
        
        .btn * {
            pointer-events: none;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
        }

        .btn.active {
            background-color: #f22727;
            color: #fff;
            box-shadow: 
                inset 0 0 15px rgba(150,0,0,0.8),
                0 0 15px rgba(242,39,39,0.5);
            border-color: #900;
        }

        .btn svg {
            width: 30px;
            height: 30px;
            fill: #222;
        }
        .btn.active svg {
            fill: #fff;
        }

        .btn-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="remote">
        <div class="speaker-grill">
            <div class="grill-line"></div>
            <div class="grill-line"></div>
            <div class="grill-line"></div>
        </div>

        <div class="button-grid">
            <div class="btn" id="btn-off" onclick="turnOffAll()">
                <span class="btn-text">OFF</span>
            </div>
            <div class="btn" id="btn-radio" onclick="toggleLightBtn('btn-radio')">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
            </div>

            <div class="btn" id="btn-siren" onclick="toggleSiren()">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
            
            <div class="btn" id="btn-ah">
                <span class="btn-text">AH</span>
            </div>

            <div class="btn" id="btn-light1" onclick="toggleLightBtn('btn-light1')">
                <svg viewBox="0 0 24 24"><path d="M12 2L8 6h8l-4-4zm-5 6c-1.1 0-2 .9-2 2v2h14v-2c0-1.1-.9-2-2-2H7zm-3 6v2h20v-2H4z" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/></svg>
            </div>
            <div class="btn" id="btn-light2" onclick="toggleLightBtn('btn-light2')">
                <svg viewBox="0 0 24 24"><path d="M12 2L8 6h8l-4-4zm-5 6c-1.1 0-2 .9-2 2v2h14v-2c0-1.1-.9-2-2-2H7zm-3 6v2h20v-2H4z"/></svg>
            </div>

            <div class="btn" id="btn-grill1" onclick="toggleLightBtn('btn-grill1')">
                <span class="btn-text">≡D</span>
            </div>
            <div class="btn" id="btn-grill2" onclick="toggleLightBtn('btn-grill2')">
                <span class="btn-text">⇨⇦</span>
            </div>

            <div class="btn" id="btn-aux1" onclick="toggleLightBtn('btn-aux1')">
                <svg viewBox="0 0 24 24"><path d="M12 2c-4.97 0-9 4.03-9 9 0 3.53 2.04 6.58 5 8.05V22h8v-2.95c2.96-1.47 5-4.52 5-8.05 0-4.97-4.03-9-9-9zm-2 18v-2h4v2h-4zm2-4c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </div>
            <div class="btn" id="btn-aux2" onclick="toggleLightBtn('btn-aux2')">
                <span style="font-size: 24px;">•</span>
            </div>
        </div>
    </div>

    <script>
        // --- NOWY SILNIK AUDIO: Web Audio API ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        const audioBuffers = {};
        
        let isSirenActive = false;
        let currentModIndex = 0;
        // Dodano 4 dźwięk: priority
        const sirenModes = ['wilk', 'pies', 'leon', 'priority']; 

        let currentSirenSource = null;
        let currentHornSource = null;

        // Funkcja wczytująca pliki do pamięci (RAM) dla natychmiastowego startu
        async function initAudioSystem() {
            if (audioCtx) return; // Zapobiega wielokrotnej inicjalizacji
            
            audioCtx = new AudioContext();
            
            const files = {
                'wilk': 'wilk.mp3',
                'pies': 'pies.mp3',
                'leon': 'leon.mp3',
                'priority': 'priority.mp3', // Nowy plik
                'horn': 'horn.mp3'
            };

            for (const [name, url] of Object.entries(files)) {
                try {
                    const response = await fetch(url);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    audioBuffers[name] = audioBuffer;
                } catch (error) {
                    console.error(`Nie udało się załadować dźwięku ${url}`, error);
                }
            }
        }

        // Pomocnicza funkcja odtwarzająca dźwięk z bufora
        function playBuffer(bufferName, loop = true) {
            if (!audioCtx || !audioBuffers[bufferName]) return null;
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[bufferName];
            source.loop = loop;
            source.connect(audioCtx.destination);
            source.start(0);
            return source;
        }

        // --- OBSŁUGA SYRENY (Nutka) ---
        async function toggleSiren() {
            await initAudioSystem();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const btnSiren = document.getElementById('btn-siren');

            if (!isSirenActive) {
                // START
                isSirenActive = true;
                currentModIndex = 0; // Zawsze startujemy od Wilka
                btnSiren.classList.add('active');
                currentSirenSource = playBuffer(sirenModes[currentModIndex]);
            } else {
                // ZMIANA MODULACJI
                if (currentSirenSource) {
                    currentSirenSource.stop();
                }
                
                // Przejście przez: 0(wilk) -> 1(pies) -> 2(leon) -> 3(priority) -> 0(wilk)...
                currentModIndex = (currentModIndex + 1) % sirenModes.length;
                currentSirenSource = playBuffer(sirenModes[currentModIndex]);
            }
        }

        // --- OBSŁUGA AIR HORN (Momentary) ---
        const btnAh = document.getElementById('btn-ah');
        btnAh.addEventListener('pointerdown', startAirHorn);
        btnAh.addEventListener('pointerup', stopAirHorn);
        btnAh.addEventListener('pointerleave', stopAirHorn); // Zabezpieczenie przed zjechaniem kursorem

        async function startAirHorn(e) {
            e.preventDefault();
            await initAudioSystem();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            btnAh.classList.add('active');

            // Zatrzymaj aktualnie grającą syrenę (na czas użycia AH)
            if (currentSirenSource) {
                currentSirenSource.stop();
                currentSirenSource = null;
            }

            // Start Air Horn
            if (currentHornSource) {
                currentHornSource.stop();
            }
            currentHornSource = playBuffer('horn', true);
        }

        function stopAirHorn(e) {
            if (e) e.preventDefault();
            btnAh.classList.remove('active');

            // Zatrzymujemy Air Horn
            if (currentHornSource) {
                currentHornSource.stop();
                currentHornSource = null;
            }

            // Jeśli syrena była włączona - przywracamy wybraną modulację
            if (isSirenActive && audioCtx) {
                currentSirenSource = playBuffer(sirenModes[currentModIndex]);
            }
        }

        // --- OBSŁUGA PRZYCISKU OFF ---
        function turnOffAll() {
            isSirenActive = false;
            
            if (currentSirenSource) {
                currentSirenSource.stop();
                currentSirenSource = null;
            }
            if (currentHornSource) {
                currentHornSource.stop();
                currentHornSource = null;
            }
            
            // Wyłączamy podświetlenie wszystkich przycisków
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            
            // Mignięcie przycisku OFF
            const btnOff = document.getElementById('btn-off');
            btnOff.style.backgroundColor = '#999';
            setTimeout(() => { btnOff.style.backgroundColor = ''; }, 150);
        }

        // --- OBSŁUGA ŚWIATEŁ (Toggle) ---
        function toggleLightBtn(id) {
            const btn = document.getElementById(id);
            btn.classList.toggle('active');
        }
    </script>
</body>
</html>
