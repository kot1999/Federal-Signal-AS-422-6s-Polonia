<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symulator Federal Signal AS 422 Polonia</title>
    <style>
        * {
            -webkit-touch-callout: none; /* Blokuje menu na iOS/Android */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #16171a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial Narrow', Arial, sans-serif;
            touch-action: none; /* Całkowicie blokuje gesty przeglądarki przy trzymaniu palca */
            overflow: hidden;
        }

        .remote-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Główna obudowa pilota */
        .remote {
            width: 196px;
            background: linear-gradient(145deg, #323438 0%, #222326 50%, #18191b 100%);
            padding: 18px 20px 24px 20px;
            border-radius: 26px;
            position: relative;
            box-shadow: 
                inset 2px 3px 5px rgba(255, 255, 255, 0.18),
                inset -3px -5px 8px rgba(0, 0, 0, 0.8),
                0 25px 50px rgba(0, 0, 0, 0.85);
            border: 1px solid #111;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Wewnętrzne przetłoczenie obudowy */
        .remote::before {
            content: "";
            position: absolute;
            top: 8px;
            bottom: 10px;
            left: 10px;
            right: 10px;
            border-radius: 18px;
            pointer-events: none;
            box-shadow: 
                inset 0 2px 6px rgba(0, 0, 0, 0.65),
                0 1px 1px rgba(255, 255, 255, 0.07);
        }

        /* Maskownica głośnika na górze (trapez zwężający się w dół) */
        .speaker-recess {
            background: linear-gradient(180deg, #1b1c1e 0%, #292a2e 100%);
            padding: 6px 14px;
            border-radius: 6px 6px 12px 12px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 
                inset 0 3px 5px rgba(0,0,0,0.9),
                0 1px 1px rgba(255,255,255,0.1);
            z-index: 1;
        }

        .grill-line {
            background: #09090a;
            height: 5px;
            border-radius: 3px;
            box-shadow: 
                inset 0 2px 3px #000,
                0 1px 0 rgba(255,255,255,0.12);
        }
        .grill-line:nth-child(1) { width: 68px; }
        .grill-line:nth-child(2) { width: 58px; }
        .grill-line:nth-child(3) { width: 48px; }

        /* Panel z gniazdami przycisków */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            z-index: 1;
        }

        /* Pojedyncze gniazdo (wgłębienie w plastiku) */
        .btn-well {
            background: #141517;
            padding: 4px;
            border-radius: 10px;
            box-shadow: 
                inset 0 3px 6px rgba(0,0,0,0.95),
                0 1px 1px rgba(255,255,255,0.08);
        }

        /* Silikonowy przycisk */
        .btn {
            background: radial-gradient(circle at 50% 45%, #dce8f2 0%, #c6d4e1 70%, #b3c2d1 100%);
            height: 62px;
            width: 100%;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #8e9ba8;
            box-shadow: 
                inset 0 2px 3px rgba(255, 255, 255, 0.9),
                inset 0 -2px 4px rgba(0, 0, 0, 0.22),
                0 3px 5px rgba(0, 0, 0, 0.7);
            transition: transform 0.06s ease, background 0.1s ease, box-shadow 0.1s ease;
            pointer-events: auto;
            touch-action: none;
        }

        .btn * {
            pointer-events: none;
        }

        .btn:active {
            transform: scale(0.96) translateY(1px);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Czerwone podświetlenie LED od spodu gumowego przycisku */
        .btn.active {
            background: radial-gradient(circle at 50% 50%, #ff4d4d 0%, #e61919 60%, #a80000 100%);
            border-color: #ff3333;
            box-shadow: 
                inset 0 0 10px rgba(255, 200, 200, 0.6),
                inset 0 -2px 6px rgba(80, 0, 0, 0.8),
                0 0 16px rgba(255, 30, 30, 0.75);
        }

        .btn svg {
            width: 48px;
            height: 48px;
            overflow: visible;
        }

        /* Kolor nadruku na przyciskach */
        .icon-fill {
            fill: #2c3036;
        }
        .icon-stroke {
            stroke: #2c3036;
        }
        .btn.active .icon-fill {
            fill: #1a0505;
        }
        .btn.active .icon-stroke {
            stroke: #1a0505;
        }

        /* Delikatny punkt na ostatnim pustym przycisku */
        .led-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(160, 145, 165, 0.55) 0%, rgba(160, 145, 165, 0) 75%);
        }

        /* Odciążka i przewód na dole pilota */
        .cable-boot {
            width: 54px;
            height: 14px;
            background: linear-gradient(90deg, #141416, #292a2d, #141416);
            clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
            margin-top: -1px;
        }
        .cable {
            width: 28px;
            height: 36px;
            background: linear-gradient(90deg, #0e0e10, #232427, #0b0b0c);
        }
    </style>
</head>
<body>

    <div class="remote-wrapper">
        <div class="remote">
            <!-- Maskownica głośnika -->
            <div class="speaker-recess">
                <div class="grill-line"></div>
                <div class="grill-line"></div>
                <div class="grill-line"></div>
            </div>

            <div class="button-grid">
                <!-- Rząd 1: OFF | Mikrofon -->
                <div class="btn-well">
                    <div class="btn" id="btn-off" onclick="turnOffAll()">
                        <svg viewBox="0 0 60 60">
                            <text x="30" y="41" text-anchor="middle" class="icon-fill" font-family="Arial, sans-serif" font-weight="bold" font-size="31" textLength="46" lengthAdjust="spacingAndGlyphs">OFF</text>

                    </div>
                </div>

                <div class="btn-well">

                </div>

                <!-- Rząd 2: Dwie nutki | AH -->
                <div class="btn-well">
                    <div class="btn" id="btn-siren" onclick="toggleSiren()">
                        <svg viewBox="0 0 60 60">
                            <!-- Nutka lewa górna -->
                            <g transform="translate(19, 25) rotate(-12)">
                                <ellipse cx="-4" cy="7" rx="5.5" ry="3.8" transform="rotate(-20 -4 7)" class="icon-fill"/>
                                <path d="M0.5,6 L0.5,-11 C5,-8 8,-4 7,2" fill="none" class="icon-stroke" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                            <!-- Nutka prawa dolna -->
                            <g transform="translate(41, 36) rotate(8)">
                                <ellipse cx="-4" cy="7" rx="5.5" ry="3.8" transform="rotate(-20 -4 7)" class="icon-fill"/>
                                <path d="M0.5,6 L0.5,-11 C5,-8 8,-4 7,2" fill="none" class="icon-stroke" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <div class="btn-well">
                    <div class="btn" id="btn-ah">
                        <svg viewBox="0 0 60 60">
                            <text x="30" y="41" text-anchor="middle" class="icon-fill" font-family="Arial, sans-serif" font-weight="bold" font-size="32" textLength="38" lengthAdjust="spacingAndGlyphs">AH</text>
                        </svg>
                    </div>
                </div>

                <!-- Rząd 3: Kogut pusty | Kogut półpełny -->
                <div class="btn-well">
                    <div class="btn" id="btn-light1" onclick="toggleLightBtn('btn-light1')">
                        <svg viewBox="0 0 60 60">
                            <rect x="15" y="42" width="30" height="6" rx="2" class="icon-fill"/>
                            <path d="M19,42 L20,23 C20,14 40,14 40,23 L41,42 Z" fill="none" class="icon-stroke" stroke-width="3.2" stroke-linejoin="round"/>
                            <line x1="8" y1="16" x2="15" y2="20" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="7" y1="26" x2="14" y2="27" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="8" y1="36" x2="15" y2="34" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="52" y1="16" x2="45" y2="20" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="53" y1="26" x2="46" y2="27" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="52" y1="36" x2="45" y2="34" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <div class="btn-well">
                    <div class="btn" id="btn-light2" onclick="toggleLightBtn('btn-light2')">
                        <svg viewBox="0 0 60 60">
                            <rect x="15" y="42" width="30" height="6" rx="2" class="icon-fill"/>
                            <path d="M19,42 L20,23 C20,14 40,14 40,23 L41,42 Z" fill="none" class="icon-stroke" stroke-width="3.2" stroke-linejoin="round"/>
                            <path d="M30,16.2 C35.5,16.2 40,18.5 40,23 L41,42 L30,42 Z" class="icon-fill"/>
                            <line x1="8" y1="16" x2="15" y2="20" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="7" y1="26" x2="14" y2="27" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="8" y1="36" x2="15" y2="34" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="52" y1="16" x2="45" y2="20" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="53" y1="26" x2="46" y2="27" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                            <line x1="52" y1="36" x2="45" y2="34" class="icon-stroke" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <!-- Rząd 4: Dwa reflektory w górę | Dwa reflektory do środka -->
                <div class="btn-well">
                    <div class="btn" id="btn-grill1" onclick="toggleLightBtn('btn-grill1')">
                        <svg viewBox="0 0 60 60">
                            <path d="M7,31 A10,9.5 0 0,0 27,31 Z" fill="none" class="icon-stroke" stroke-width="2.8" stroke-linejoin="round"/>
                            <line x1="12" y1="20" x2="12" y2="26" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="17" y1="20" x2="17" y2="26" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="22" y1="20" x2="22" y2="26" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>

                            <path d="M33,31 A10,9.5 0 0,0 53,31 Z" fill="none" class="icon-stroke" stroke-width="2.8" stroke-linejoin="round"/>
                            <line x1="38" y1="20" x2="38" y2="26" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="43" y1="20" x2="43" y2="26" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="48" y1="20" x2="48" y2="26" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <div class="btn-well">
                    <div class="btn" id="btn-grill2" onclick="toggleLightBtn('btn-grill2')">
                        <svg viewBox="0 0 60 60">
                            <path d="M16,20 A10,10 0 0,1 16,40 Z" fill="none" class="icon-stroke" stroke-width="2.8" stroke-linejoin="round"/>
                            <line x1="6" y1="24" x2="12" y2="24" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="6" y1="30" x2="12" y2="30" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="6" y1="36" x2="12" y2="36" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>

                            <path d="M44,20 A10,10 0 0,0 44,40 Z" fill="none" class="icon-stroke" stroke-width="2.8" stroke-linejoin="round"/>
                            <line x1="48" y1="24" x2="54" y2="24" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="48" y1="30" x2="54" y2="30" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                            <line x1="48" y1="36" x2="54" y2="36" class="icon-stroke" stroke-width="2.6" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <!-- Rząd 5: Lampka sufitowa | Pusty przycisk -->
                <div class="btn-well">
                    <div class="btn" id="btn-aux1" onclick="toggleLightBtn('btn-aux1')">
                        <svg viewBox="0 0 60 60">
                            <line x1="16" y1="20" x2="44" y2="20" class="icon-stroke" stroke-width="3.6" stroke-linecap="round"/>
                            <path d="M21,21 A9,7.5 0 0,0 39,21 Z" fill="none" class="icon-stroke" stroke-width="2.8"/>
                            <line x1="18" y1="31" x2="15" y2="34" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="12" y1="37" x2="9" y2="40" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="24" y1="33" x2="22" y2="37" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="20" y1="41" x2="18" y2="44" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="30" y1="34" x2="30" y2="38" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="30" y1="42" x2="30" y2="46" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="36" y1="33" x2="38" y2="37" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="40" y1="41" x2="42" y2="44" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="42" y1="31" x2="45" y2="34" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                            <line x1="48" y1="37" x2="51" y2="40" class="icon-stroke" stroke-width="2.8" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>

                <div class="btn-well">
                    <div class="btn" id="btn-aux2" onclick="toggleLightBtn('btn-aux2')">
                        <div class="led-dot"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Przewód wychodzący z dołu pilota -->
        <div class="cable-boot"></div>
        <div class="cable"></div>
    </div>

    <script>
        // Blokada menu kontekstowego przy długim przytrzymaniu palca na ekranie dotykowym
        window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, { passive: false });

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        const audioBuffers = {};
        
        let isSirenActive = false;
        let isAhPressed = false;
        let currentModIndex = 0;
        const sirenModes = ['wilk', 'pies', 'leon', 'priority']; 

        let currentSirenSource = null;
        let currentHornSource = null;

        // Korektor głośności dla poszczególnych ścieżek
        const volumes = {
            'wilk': 1.0,
            'pies': 1.0,
            'leon': 1.0,
            'priority': 2.5,
            'horn': 3.0
        };

        async function loadSoundFile(name, extensions) {
            for (const ext of extensions) {
                const url = `${name}.${ext}`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const arrayBuffer = await response.arrayBuffer();
                    audioBuffers[name] = await audioCtx.decodeAudioData(arrayBuffer);
                    return;
                } catch (e) {}
            }
            console.error(`Nie znaleziono pliku audio dla: ${name}`);
        }

        async function initAudioSystem() {
            if (audioCtx) return;
            audioCtx = new AudioContext();
            
            await Promise.all([
                loadSoundFile('wilk', ['mp3', 'wav']),
                loadSoundFile('pies', ['mp3', 'wav']),
                loadSoundFile('leon', ['mp3', 'wav']),
                loadSoundFile('priority', ['wav', 'mp3']),
                loadSoundFile('horn', ['wav', 'mp3'])
            ]);
        }

        function playBuffer(bufferName, loop = true) {
            if (!audioCtx || !audioBuffers[bufferName]) return null;
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[bufferName];
            source.loop = loop;
            
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = volumes[bufferName] || 1.0;
            
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            source.start(0);
            return source;
        }

        // --- OBSŁUGA SYRENY (Nutki) ---
        async function toggleSiren() {
            await initAudioSystem();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const btnSiren = document.getElementById('btn-siren');

            if (!isSirenActive) {
                isSirenActive = true;
                currentModIndex = 0; 
                btnSiren.classList.add('active');
                
                if (currentSirenSource) {
                    try { currentSirenSource.stop(); } catch(e){}
                }
                
                if (!isAhPressed) {
                    currentSirenSource = playBuffer(sirenModes[currentModIndex]);
                }
            } else {
                if (currentSirenSource) {
                    try { currentSirenSource.stop(); } catch(e){}
                    currentSirenSource = null;
                }
                
                currentModIndex = (currentModIndex + 1) % sirenModes.length;
                
                if (!isAhPressed) {
                    currentSirenSource = playBuffer(sirenModes[currentModIndex]);
                }
            }
        }

        // --- OBSŁUGA AIR HORN (Chwilowy - odporny na długie przytrzymanie na dotyku) ---
        const btnAh = document.getElementById('btn-ah');

        // Obsługa dotyku (blokuje wywołanie menu systemowego)
        btnAh.addEventListener('touchstart', startAirHorn, { passive: false });
        btnAh.addEventListener('touchend', stopAirHorn, { passive: false });
        btnAh.addEventListener('touchcancel', stopAirHorn, { passive: false });

        // Obsługa myszy / rysika
        btnAh.addEventListener('pointerdown', startAirHorn);
        btnAh.addEventListener('pointerup', stopAirHorn);
        btnAh.addEventListener('pointerleave', stopAirHorn);
        btnAh.addEventListener('pointercancel', stopAirHorn);

        async function startAirHorn(e) {
            if (e && e.cancelable) e.preventDefault();
            if (isAhPressed) return;
            isAhPressed = true;
            
            await initAudioSystem();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            btnAh.classList.add('active');

            if (currentSirenSource) {
                try { currentSirenSource.stop(); } catch(e){}
                currentSirenSource = null;
            }

            if (currentHornSource) {
                try { currentHornSource.stop(); } catch(e){}
            }
            currentHornSource = playBuffer('horn', true);
        }

        function stopAirHorn(e) {
            if (e && e.cancelable) e.preventDefault();
            if (!isAhPressed) return;
            isAhPressed = false;
            
            btnAh.classList.remove('active');

            if (currentHornSource) {
                try { currentHornSource.stop(); } catch(e){}
                currentHornSource = null;
            }

            if (isSirenActive && audioCtx) {
                if (currentSirenSource) {
                    try { currentSirenSource.stop(); } catch(e){}
                }
                currentSirenSource = playBuffer(sirenModes[currentModIndex]);
            }
        }

        // --- OBSŁUGA PRZYCISKU OFF ---
        function turnOffAll() {
            isSirenActive = false;
            isAhPressed = false;
            
            if (currentSirenSource) {
                try { currentSirenSource.stop(); } catch(e){}
                currentSirenSource = null;
            }
            if (currentHornSource) {
                try { currentHornSource.stop(); } catch(e){}
                currentHornSource = null;
            }
            
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        }

        // --- OBSŁUGA ŚWIATEŁ ---
        function toggleLightBtn(id) {
            const btn = document.getElementById(id);
            btn.classList.toggle('active');
        }
    </script>
</body>
</html>
